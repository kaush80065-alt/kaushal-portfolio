<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title description">
  <title id="title">Kaushal Kumar Sharma illustrated avatar</title>
  <desc id="description">A warm illustrated portrait of a young Indian man with dark wavy hair and a black shirt.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#f3eee2"/>
      <stop offset="0.68" stop-color="#d8d1c2"/>
      <stop offset="1" stop-color="#aaa492"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d1e21"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.15" y1="0" x2="0.85" y2="1">
