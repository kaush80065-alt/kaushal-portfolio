      <stop offset="0.55" stop-color="#b87350"/>
      <stop offset="1" stop-color="#985b43"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17151a"/>
      <stop offset="0.7" stop-color="#09090b"/>
      <stop offset="1" stop-color="#2d2930"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6f6a5f" flood-opacity=".36"/>
    </filter>
  </defs>

